<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bili Daily Popup - NEON DREAM Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popup">
    <!-- 背景装饰 -->
    <div class="bg-ambient bg-ambient-cyan" aria-hidden="true"></div>
    <div class="bg-ambient bg-ambient-magenta" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-label="Bili Daily">BD</div>
        <div class="brand-text">
          <h1 class="brand-title">BILI DAILY</h1>
          <p class="brand-subtitle">NEON EDITION</p>
        </div>
      </div>
      <div class="neo-avatar" aria-label="NEO // RIN 助手">
        <!-- NEO / RIN 头像 -->
        <img src="../../assets/neo-reference.png.png"
             alt="NEO / RIN"
             class="neo-avatar-img"
             loading="lazy">
        <div class="neo-ring"></div>
      </div>
    </header>

    <!-- 昨日观看总结 -->
    <section class="card card-yesterday">
      <div class="card-header">
        <h2 class="card-title">昨日观看</h2>
        <span class="card-date" id="yesterdayDate">11 月 12 日</span>
      </div>

      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value" id="videoCount">12</div>
          <div class="stat-label">视频</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-value" id="duration">3.1</div>
          <div class="stat-label">小时</div>
        </div>
      </div>

      <div class="partition-row">
        <span class="partition-badge" id="topPartition">动画 42%</span>
        <span class="partition-badge partition-secondary" id="secondPartition">游戏 28%</span>
      </div>

      <div class="up-avatars" id="upAvatars">
        <!-- UP 主头像列表 -->
      </div>
    </section>

    <!-- 快速操作 -->
    <div class="action-row">
      <button class="btn btn-primary btn-large" id="openDashboard">
        <span class="btn-icon">→</span>
        打开完整仪表盘
      </button>
      <button class="btn btn-secondary" id="refreshRec">
        <span class="btn-icon">↻</span>
        刷新推荐
      </button>
    </div>

    <!-- 7 天兴趣画像 (紧凑版) -->
    <section class="card card-profile">
      <div class="card-header">
        <h2 class="card-title">7 天兴趣画像</h2>
        <span class="pill pill-ready">就绪</span>
      </div>

      <canvas id="radarChart" width="360" height="200"></canvas>

      <div class="profile-summary">
        <span class="profile-text" id="profileSummary">活跃 6 天 · 主要兴趣：动画、游戏、科技</span>
      </div>
    </section>

    <!-- 今日推荐 (折叠) -->
    <section class="card card-recommendations">
      <div class="card-header">
        <h2 class="card-title">今日推荐</h2>
        <button class="btn-expand" id="toggleRec" aria-expanded="false">
          <span class="expand-icon">▼</span>
        </button>
      </div>

      <div class="rec-list" id="recList" hidden>
        <!-- 推荐列表 -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-status">
        <span class="status-dot"></span>
        <span class="status-text">本地存储 · 无上传</span>
      </div>
      <div class="footer-version">v1.1 NEON</div>
    </footer>
  </div>

  <script src="../mock-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
