<svg width="160" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="avatarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6B4FBF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2D1B4E;stop-opacity:0.95" />
    </radialGradient>
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="80" cy="80" r="78" fill="url(#avatarGrad)"
          stroke="#5CF2FF" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>

  <!-- Inner glow ring -->
  <circle cx="80" cy="80" r="60" fill="none"
          stroke="#5CF2FF" stroke-width="1" opacity="0.3"/>

  <!-- Character initial -->
  <text x="80" y="90" font-family="'Cascadia Code', monospace"
        font-size="56" font-weight="700" fill="#5CF2FF"
        text-anchor="middle" filter="url(#avatarGlow)">N</text>

  <!-- Label bottom -->
  <text x="80" y="130" font-family="sans-serif" font-size="12"
        fill="#8BA2C7" text-anchor="middle">NEO AVATAR</text>
  <text x="80" y="145" font-family="sans-serif" font-size="10"
        fill="#62749A" text-anchor="middle">PLACEHOLDER · 160x160</text>
</svg>
