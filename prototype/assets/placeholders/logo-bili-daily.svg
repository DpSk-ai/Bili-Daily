<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CF2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B7BFF;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0A0E1C" rx="24"/>

  <!-- Geometric pattern (斜切角矩形) -->
  <path d="M 60 50 L 140 50 L 150 60 L 150 140 L 140 150 L 60 150 L 50 140 L 50 60 Z"
        fill="none"
        stroke="url(#logoGrad)"
        stroke-width="3"
        filter="url(#logoGlow)"/>

  <!-- Inner accent lines -->
  <line x1="70" y1="70" x2="130" y2="70" stroke="#5CF2FF" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="130" x2="130" y2="130" stroke="#FF4FD8" stroke-width="2" opacity="0.6"/>

  <!-- Text: BD (Bili Daily) -->
  <text x="100" y="115" font-family="'Cascadia Code', monospace"
        font-size="48" font-weight="700" fill="url(#logoGrad)"
        text-anchor="middle" filter="url(#logoGlow)">BD</text>

  <!-- Subtitle -->
  <text x="100" y="175" font-family="'Cascadia Code', monospace"
        font-size="12" fill="#8BA2C7" text-anchor="middle">BILI DAILY</text>
  <text x="100" y="190" font-family="'Cascadia Code', monospace"
        font-size="10" fill="#5CF2FF" text-anchor="middle">NEON EDITION</text>
</svg>
